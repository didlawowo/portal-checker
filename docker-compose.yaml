
services:
  portal-checker:
    container_name: portal-checker
    hostname: portal-checker
    ports:
      - "5002:5000"
    build:
      platforms:
        # - linux/amd64
        - linux/arm64
      context: . 
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - EXCLUDED_URLS_FILE=excluded-urls.yaml
      - URLS_FILE=urls.yaml
name: Helm Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: arc-runner-portal-checker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
 

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint helm

      - name: Render Helm chart
        run: helm template portal-checker helm

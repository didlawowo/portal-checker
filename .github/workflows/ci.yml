name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: arc-runner-portal-checker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv and Ruff
        run: python -m pip install --upgrade pip 'uv==0.11.29' 'ruff==0.15.22'

      - name: Install development dependencies
        run: uv sync --extra dev --locked

      - name: Check format
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing

  dashboard-tests:
    name: Dashboard Node tests
    runs-on: arc-runner-portal-checker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Run dashboard tests
        run: node --test tests/dashboard.test.cjs
